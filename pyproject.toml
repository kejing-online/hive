[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hive-os"
version = "0.3.0"
description = "Portable multi-worker development OS: task DAG, leases, worktrees."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Hive contributors" }]

[project.scripts]
hive = "hive.cli:main"

[tool.setuptools.packages.find]
include = ["hive*"]
